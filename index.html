<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"></link>
    <script src="scripts.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div id="container">
        <h1 class="title">Rock-Paper-Scissors</h1>
        <p class="subtitle">GAME<p>
        <p class="instructions">Choose a hand!<p>
        <ul id="handsContainer">
            <li class="hands", id="rock">Rock</li>
            <li class="hands", id="paper">Paper</li>
            <li class="hands", id="scissors">Scissors</li>
        </ul>
    </div>
    
</body>
</html>
